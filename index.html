<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="search-container">
                <input type="text" id="username-input" placeholder="Digite o nome de usuário do GitHub">
                <button id="search-button">Buscar</button>
            </div>

            <div class="profile-info hidden">
                <img class="profile-avatar" src="https://via.placeholder.com/180x180" alt="Avatar">
                <h1 class="profile-name"></h1>
                <h2 class="profile-username"></h2>
                <ul class="numbers">
                    <li class="numbers-item">
                        <h4>Repositórios</h4>
                        <span id="repos">0</span>
                    </li>
                    <li class="numbers-item">
                        <h4>Seguidores</h4>
                        <span id="followers">0</span>
                    </li>
                    <li class="numbers-item">
                        <h4>Seguindo</h4>
                        <span id="following">0</span>
                    </li>
                </ul>
                <a href="#" class="profile-link" id="github-link">Ver no Github</a>
            </div>
        </div>
    </header>
    <script src="main.js"></script>
</body>
</html>
